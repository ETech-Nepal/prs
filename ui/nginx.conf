server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — all routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Basic hardening headers (add HSTS/CSP at the TLS-terminating proxy in prod).
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy no-referrer;

  # index.html must NEVER be cached without revalidating: it is the pointer to the
  # content-hashed bundles, so a stale copy keeps loading a deleted JS filename and
  # the browser shows an old build long after a deploy. Without this, nginx sends
  # only Last-Modified/ETag and browsers cache it heuristically — which served a
  # removed UI card for a full deploy cycle. "no-cache" means revalidate, not "don't
  # store": the response is still a cheap 304 when nothing changed.
  #
  # Inherited by `location /` (and so by the SPA fallback) because that block sets no
  # add_header of its own — nginx only inherits add_header from an outer level when
  # the inner level declares none.
  add_header Cache-Control "no-cache";

  # Long-cache hashed assets: the filename changes whenever the content does, so a
  # stale one can never be served. This block declares its own add_header, which drops
  # every inherited one — hence nosniff is repeated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff;
  }
}
